<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI新闻洞察：收藏价值新闻，提炼洞见。聚合个人收藏与AI洞察日报点赞文章。">
  <meta name="theme-color" content="#fafbfc">
  <title>AI新闻洞察</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container" id="top">
    <header class="hero">
      <span class="eyebrow">MY AI READING LIBRARY</span>
      <h1>AI新闻洞察</h1>
      <p>收藏价值新闻，提炼洞见</p>
    </header>

    <section class="library" aria-labelledby="library-title">
      <div class="section-head">
        <div><h2 id="library-title">精选文章</h2><p class="hint">来自个人收藏和 AI 洞察日报点赞，按日报主题分类。</p></div>
        <span class="count" id="total-count" aria-live="polite"></span>
      </div>
      <div class="toolbar" role="group" aria-label="筛选文章来源">
        <div class="filters" id="source-filters">
          <button class="filter is-active" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter" data-filter="saved" aria-pressed="false">个人收藏</button>
          <button class="filter" data-filter="liked" aria-pressed="false">日报点赞</button>
        </div>
        <span class="view-count" id="view-count" aria-live="polite"></span>
      </div>
      <div id="library-content" class="library-content" aria-live="polite">
        <div class="empty-state">正在载入精选文章…</div>
      </div>
    </section>

    <footer class="footer" aria-label="原始资料">
      <div>
        <h2>原始资料</h2>
        <p>查看完整日报和知识库，核对文章原始来源。</p>
      </div>
      <div class="source-links">
        <a href="https://ai-insight-daily-luoqing-20261026.wulizhenmin.chatgpt.site/" target="_blank" rel="noopener noreferrer">AI 洞察日报 <span aria-hidden="true">↗</span></a>
        <a href="https://github.com/yokim99/ai-frontier-knowledge" target="_blank" rel="noopener noreferrer">GitHub 知识库 <span aria-hidden="true">↗</span></a>
      </div>
    </footer>
  </main>
</body>
</html>
